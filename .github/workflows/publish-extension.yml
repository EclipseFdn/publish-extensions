name: Publish extension
run-name: Publish extension ${{ fromJson(inputs.extension).id }}
on:
  workflow_dispatch:
    inputs:
      extension:
        description: Extension JSON object
        required: true
        type: string
      publishContext:
        description: Publish context JSON object
        required: true
        type: string
      skipPublish:
        description: Skip publishing to Open VSX, only build extensions
        type: boolean
        required: false
        default: false
      force:
        description: Force publish to Open VSX, even if version is already published
        type: boolean
        required: false
        default: false
jobs:
  download_release:
    name: Download latest release (${{ fromJson(inputs.extension).id }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DO_DOWNLOAD: ${{ fromJSON(inputs.publishContext).files != null }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        if: ${{ env.DO_DOWNLOAD == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ env.DO_DOWNLOAD == 'true' }}
        with:
          node-version: "24.x"
      - run: npm install
        if: ${{ env.DO_DOWNLOAD == 'true' }}
      - run: npm i -g @vscode/vsce pnpm
        if: ${{ env.DO_DOWNLOAD == 'true' }}
      - id: download_extension
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        if: ${{ env.DO_DOWNLOAD == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTENSION: ${{ inputs.extension }}
          PUBLISH_CONTEXT: ${{ inputs.publishContext }}
        with:
          script: |
            const script = require('./scripts/download-extension.js');
            await script();
  plan:
    name: Plan build (${{ fromJson(inputs.extension).id }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - id: plan
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXTENSION: ${{ inputs.extension }}
          PUBLISH_CONTEXT: ${{ inputs.publishContext }}
        with:
          script: |
            const { buildLegs } = require('./lib/targets.js');
            const legs = buildLegs(JSON.parse(process.env.EXTENSION), JSON.parse(process.env.PUBLISH_CONTEXT));
            core.info(JSON.stringify(legs, null, 2));
            core.setOutput("legs", JSON.stringify(legs));
    outputs:
      legs: ${{ steps.plan.outputs.legs }}
  build_extension:
    name: Build Extension (${{ fromJson(inputs.extension).id }}, ${{ matrix.name }})
    runs-on: ${{ matrix.runsOn }}
    needs: [download_release, plan]
    strategy:
      # Every leg runs to the end, but nothing is published unless all of them succeed.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.legs) }}
    defaults:
      run:
        shell: bash
    permissions:
      actions: none
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "microsoft"
          java-version: "21"
      - name: Install dependencies for native modules
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install libpango1.0-dev libgif-dev
      - run: npm install
      - run: npm i -g @vscode/vsce pnpm
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        if: ${{ fromJSON(inputs.publishContext).files != null }}
        with:
          path: /tmp/download
      - id: build_extension
        name: Build extension
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          FORCE: ${{ inputs.force }}
          SKIP_PUBLISH: ${{ inputs.skipPublish }}
          EXTENSION: ${{ inputs.extension }}
          PUBLISH_CONTEXT: ${{inputs.publishContext}}
          BUILD_TARGET: ${{ matrix.target }}
        with:
          script: |
            const extension = JSON.parse(process.env.EXTENSION);
            const publishContext = JSON.parse(process.env.PUBLISH_CONTEXT);
            const buildScript = require('./scripts/build-extension.js');
            const extensionFiles = await buildScript(extension, publishContext);
            const uploadScript = require('./scripts/upload-artifacts.js');
            await uploadScript(extensionFiles);
  publish_extension:
    name: Publish Extension (${{ fromJson(inputs.extension).id }})
    runs-on: ubuntu-latest
    if: ${{ !inputs.skipPublish }}
    needs: build_extension
    permissions:
      actions: none
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
      - run: npm install
      - run: npm i -g @vscode/vsce pnpm
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: /tmp/artifacts
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          EXTENSION_ID: ${{ fromJson(inputs.extension).id }}
        with:
          script: |
            const extensionId = process.env.EXTENSION_ID;
            const fs = require('fs');
            const path = require('path');
            const { artifactDirectory } = require('./lib/constants.js');
            const extensionFiles = fs
              .readdirSync(artifactDirectory)
              .filter((file) => file.endsWith('.vsix'))
              .map((file) => path.join(artifactDirectory, file));
            const script = require('./scripts/publish-extension.js');
            await script(extensionId, extensionFiles);
