name: Test

on:
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
      - run: npm install
      - run: npm test
